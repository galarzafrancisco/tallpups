<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tall pups</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #000000;
        font-family: "Georgia", "Times New Roman", serif;
      }

      .content {
        text-align: center;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .title {
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        letter-spacing: 0.02em;
      }

      .subtitle {
        font-size: clamp(1rem, 3.5vw, 1.35rem);
      }

      .cta {
        display: inline-block;
        align-self: center;
        padding: 10px 20px;
        border: 1px solid #000000;
        text-decoration: none;
        color: inherit;
        font-size: 1rem;
      }

      .cta:focus-visible {
        outline: 2px solid #000000;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main class="content">
      <div class="title">tall pups</div>
      <div class="subtitle">bored, not broken</div>
      <a class="cta" href="https://tallpups.creator-spring.com/">buy the shirt</a>
    </main>
  </body>
</html>
